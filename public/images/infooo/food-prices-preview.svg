<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif"><title id="title">Why Food Prices Rise</title><desc id="desc">Two stacked dollars drawn to the same scale. A 50% jump in the farm slice raises a bakery dollar to $1.02 and a fresh-egg dollar to $1.35, because farms get about 69 cents of an egg dollar but under 5 cents of a bakery dollar.</desc><rect width="800" height="450" rx="24" fill="#effaf6"/><text x="36" y="50" font-size="25" font-weight="700" text-anchor="start" fill="#203c34">SAME SHOCK. TWO FOODS.</text><text x="36" y="82" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">Farm prices +50%. Where does your grocery money go?</text><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#14202b" stroke-width="2.2"/></pattern></defs><rect x="180" y="339.2" width="150" height="10.8" fill="#8fd18c" stroke="#14202b" stroke-width="1.6"/><rect x="180" y="339.2" width="150" height="3.6" fill="url(#hatch)" stroke="#14202b" stroke-width="1.6"/><rect x="180" y="288.1" width="150" height="51.1" fill="#f3c874" stroke="#14202b" stroke-width="1.6"/><rect x="180" y="281.2" width="150" height="7.0" fill="#8ccdf5" stroke="#14202b" stroke-width="1.6"/><rect x="180" y="262.5" width="150" height="18.7" fill="#dcaede" stroke="#14202b" stroke-width="1.6"/><rect x="180" y="212.1" width="150" height="50.3" fill="#f5a583" stroke="#14202b" stroke-width="1.6"/><rect x="180" y="207.7" width="150" height="4.5" fill="#f7e57f" stroke="#14202b" stroke-width="1.6"/><rect x="180" y="196.4" width="150" height="11.3" fill="#aebcf2" stroke="#14202b" stroke-width="1.6"/><text x="255" y="166.4" font-size="24" font-weight="800" text-anchor="middle" fill="#203c34">$1.02</text><text x="255" y="187.4" font-size="17" font-weight="700" text-anchor="middle" fill="#203c34">+2.4%</text><text x="255" y="380" font-size="19" font-weight="700" text-anchor="middle" fill="#203c34">BAKERY</text><rect x="470" y="194.5" width="150" height="155.5" fill="#8fd18c" stroke="#14202b" stroke-width="1.6"/><rect x="470" y="194.5" width="150" height="51.8" fill="url(#hatch)" stroke="#14202b" stroke-width="1.6"/><rect x="470" y="189.9" width="150" height="4.6" fill="#f3c874" stroke="#14202b" stroke-width="1.6"/><rect x="470" y="180.4" width="150" height="9.5" fill="#8ccdf5" stroke="#14202b" stroke-width="1.6"/><rect x="470" y="177.1" width="150" height="3.3" fill="#dcaede" stroke="#14202b" stroke-width="1.6"/><rect x="470" y="159.0" width="150" height="18.1" fill="#f5a583" stroke="#14202b" stroke-width="1.6"/><rect x="470" y="155.0" width="150" height="4.0" fill="#f7e57f" stroke="#14202b" stroke-width="1.6"/><rect x="470" y="148.2" width="150" height="6.8" fill="#aebcf2" stroke="#14202b" stroke-width="1.6"/><text x="545" y="118.2" font-size="24" font-weight="800" text-anchor="middle" fill="#203c34">$1.35</text><text x="545" y="139.2" font-size="17" font-weight="700" text-anchor="middle" fill="#203c34">+34.6%</text><text x="545" y="380" font-size="19" font-weight="700" text-anchor="middle" fill="#203c34">FRESH EGGS</text><line x1="150" y1="200" x2="650" y2="200" stroke="#203c34" stroke-width="2.4" stroke-dasharray="8 6"/><text x="656" y="205" font-size="15" font-weight="700" fill="#203c34">$1.00</text><text x="400" y="436" font-size="17" font-weight="700" text-anchor="middle" fill="#203c34">A COST ONLY MATTERS AS MUCH AS THE SLICE IT HITS.</text></svg>