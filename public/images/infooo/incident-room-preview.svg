<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Reconstruct the agent incident</title><desc id="desc">An agent sends a tool request to production, triggering an alert. Separate evidence fragments connect into an observed timeline, with inference kept distinct.</desc><rect width="800" height="450" rx="24" fill="#effaf6"/><g font-family="Arial,sans-serif" fill="#203c34"><text x="36" y="50" font-size="25" font-weight="700">SOMETHING HAPPENED.</text><text x="36" y="82" font-size="18">Find the evidence. Follow the action.</text><g fill="#fff" stroke="#329c7f" stroke-width="2"><rect x="37" y="124" width="180" height="113" rx="18"/><rect x="309" y="124" width="180" height="113" rx="18"/><rect x="582" y="124" width="180" height="113" rx="18" stroke="#ba3447"/></g><g fill="none" stroke="#329c7f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M223 181h76m-13-12 13 12-13 12M495 181h77m-13-12 13 12-13 12"/></g><g fill="none" stroke="#203c34" stroke-width="3"><rect x="103" y="145" width="48" height="35" rx="9"/><path d="M127 135v10m-13 14h4m18 0h4m-23 12h21M374 154l15 15-15 15m24 0h23"/><path d="M650 145h45v40h-45zM657 153h6m7 0h6m7 0h6M657 167h30"/></g><g text-anchor="middle" font-size="18" font-weight="700"><text x="127" y="214">AGENT</text><text x="399" y="214">TOOL REQUEST</text><text x="672" y="214">PRODUCTION</text></g><rect x="603" y="93" width="138" height="38" rx="19" fill="#ffe4e7" stroke="#ba3447"/><text x="672" y="118" font-size="17" font-weight="700" text-anchor="middle" fill="#8f2537">! ALERT</text><path d="M74 311h650" stroke="#329c7f" stroke-width="3"/><g fill="#fff" stroke="#329c7f" stroke-width="2"><rect x="53" y="283" width="180" height="58" rx="12"/><rect x="310" y="283" width="180" height="58" rx="12"/><rect x="568" y="283" width="180" height="58" rx="12"/></g><g font-size="17" text-anchor="middle"><text x="143" y="319">IDENTITY / AUTH</text><text x="400" y="319">RESOURCE AUDIT</text><text x="658" y="319">ACTUAL STATE</text></g><text x="400" y="395" font-size="20" text-anchor="middle" font-weight="700">OBSERVED ≠ INFERRED ≠ UNKNOWN</text></g></svg>
